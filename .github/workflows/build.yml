name: Build Pokémon JoiPlay Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Setup Essentials Base
        run: |
          echo "Descarregando a base do Pokémon Essentials..."
          curl -L -o base.zip https://github.com/vApathy/Essentials-Mobile-Base/archive/refs/heads/master.zip
          
          echo "Extraindo a base do jogo..."
          unzip -q base.zip
          cp -r Essentials-Mobile-Base-master/* .
          rm -rf Essentials-Mobile-Base-master base.zip

          echo "Garantindo ficheiro Game.ini para o JoiPlay..."
          cat << 'EOF' > Game.ini
          [Game]
          Library=RGSS104E.dll
          Scripts=Data/Scripts.rxdata
          Title=Pokemon Mobile v0.01 - Pallet Playable
          RTP1=
          RTP2=
          RTP3=
          EOF

          echo "Empacotando projeto completo para o JoiPlay..."
          zip -r pokemon-joiplay-v0.01.zip Data Graphics Scripts Game.ini README.md

      - name: Upload JoiPlay Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-joiplay-v0.01
          path: pokemon-joiplay-v0.01.zip
