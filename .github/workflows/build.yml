name: Build Pokémon JoiPlay Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Real Essentials Base Repository
        run: |
          echo "Clonando base oficial de dados binários..."
          git clone --depth 1 https://github.com/EnricoPicci/Pokemon-Essentials-Mobile.git temp_base
          
          # Copiar a pasta Data real e Game.ini para a raiz do projeto
          cp -r temp_base/Data .
          cp -r temp_base/Graphics . || mkdir -p Graphics
          cp temp_base/Game.ini . || echo -e "[Game]\nLibrary=RGSS104E.dll\nScripts=Data/Scripts.rxdata\nTitle=Pokemon Playable" > Game.ini
          
          rm -rf temp_base

          echo "Verificando tamanho dos dados gerados..."
          du -sh Data/

          echo "Compactando pacote jogável..."
          zip -r pokemon-joiplay-v0.01.zip Data Graphics Game.ini README.md

      - name: Upload JoiPlay Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-joiplay-v0.01
          path: pokemon-joiplay-v0.01.zip
