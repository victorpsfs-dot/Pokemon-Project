name: Build Pokémon Mobile APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment & Package APK
        run: |
          echo "Preparing folders for Android execution..."
          mkdir -p Data Graphics/Tilesets Graphics/Characters Scripts build_output
          
          # Simula a estrutura executável do motor para Android
          echo "Creating mock APK installer package for v0.01..."
          echo "Pokemon Essentials Mobile v0.01 - Pallet Town" > build_output/README_GAME.txt
          
          # Cria um arquivo simulando o APK compilado para teste imediato
          zip -r pokemon-v0.01-test.apk Data Graphics Scripts build_output/README_GAME.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-v0.01-apk
          path: pokemon-v0.01-test.apk
