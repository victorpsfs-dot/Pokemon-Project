name: Build Pokémon JoiPlay Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment & Package for JoiPlay (No Audio)
        run: |
          echo "Preparing lightweight project structure for JoiPlay..."
          mkdir -p Data Graphics/Tilesets Graphics/Characters Scripts
          
          # Criar o Game.ini configurado para o JoiPlay (sem RTP e sem dependência de áudio)
          cat << 'EOF' > Game.ini
          [Game]
          Library=RGSS104E.dll
          Scripts=Data/Scripts.rxdata
          Title=Pokemon Mobile v0.01
          RTP1=
          RTP2=
          RTP3=
          EOF

          # Criar o arquivo de scripts base do motor
          echo "Pokémon Essentials v0.01 Mobile" > Data/Scripts.rxdata

          # Inserir os scripts lógicos de Pallet Town (placa e bloqueio da Rota 1)
          cat << 'EOF' > Data/Scripts_PalletTown.rb
          # Pallet Town Initial Setup - v0.01
          def pbPalletTownSign
            Kernel.pbMessage(_INTL("Pallet Town\nShades of your journey await!"))
          end

          def pbRoute1Blocker
            Kernel.pbMessage(_INTL("Tall grass ahead! It's unsafe to go out without a Pokémon."))
          end
          EOF

          # Inserir o layout dos botões touch estilo GBA
          cat << 'EOF' > Scripts/TouchControlsGBA.rb
          class GBAVirtualPad
            def initialize
              @layout = :gba_standard
            end
          end
          EOF

          echo "Packaging project (Audio omitted)..."
          zip -r pokemon-joiplay-v0.01.zip Data Graphics Scripts Game.ini README.md

      - name: Upload JoiPlay Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-joiplay-v0.01
          path: pokemon-joiplay-v0.01.zip
