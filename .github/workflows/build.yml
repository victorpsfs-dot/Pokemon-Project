name: Build Pokémon JoiPlay Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment & Package for JoiPlay
        run: |
          echo "Preparing project structure for JoiPlay..."
          mkdir -p Data Graphics/Tilesets Graphics/Characters Scripts Audio
          
          # Criar o Game.ini essencial para o JoiPlay reconhecer o projeto
          cat << 'EOF' > Game.ini
          [Game]
          Library=RGSS104E.dll
          Scripts=Data/Scripts.rxdata
          Title=Pokemon Mobile v0.01
          RTP1=
          RTP2=
          RTP3=
          EOF

          # Inserir os scripts e lógica de Pallet Town
          cat << 'EOF' > Data/Scripts_PalletTown.rb
          # Pallet Town Initial Setup - v0.01
          def pbPalletTownSign
            Kernel.pbMessage(_INTL("Pallet Town\nShades of your journey await!"))
          end

          def pbRoute1Blocker
            Kernel.pbMessage(_INTL("Tall grass ahead! It's unsafe to go out without a Pokémon."))
          end
          EOF

          # Inserir a configuração dos botões touch estilo GBA
          cat << 'EOF' > Scripts/TouchControlsGBA.rb
          class GBAVirtualPad
            def initialize
              # Layout GBA: D-Pad, A, B, L, R, Select, Start
              @layout = :gba_standard
            end
          end
          EOF

          echo "Packaging project into a clean ZIP for JoiPlay..."
          zip -r pokemon-joiplay-v0.01.zip Data Graphics Scripts Audio Game.ini README.md

      - name: Upload JoiPlay Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-joiplay-v0.01
          path: pokemon-joiplay-v0.01.zip
